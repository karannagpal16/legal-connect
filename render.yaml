services:
  - type: web
    name: legal-connect
    runtime: node
    plan: free
    autoDeploy: true
    buildCommand: |
      npm install -g pnpm@11.17.0
      pnpm install --frozen-lockfile
      pnpm build
    startCommand: pnpm start
    # Liveness stays independent from PostgreSQL so Render can route static UI
    # immediately while database readiness finishes in the background.
    healthCheckPath: /api/healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: DEMO_MODE
        value: "false"
      - key: DATABASE_URL
        sync: false
      - key: PUBLIC_APP_URL
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: SESSION_SECRET
        generateValue: true
