services:
  - type: web
    name: legal-connect
    runtime: node
    plan: free
    autoDeploy: true
    buildCommand: |
      npm install -g pnpm@11.17.0
      pnpm install --frozen-lockfile
      pnpm build
    startCommand: pnpm start
    # Liveness stays independent from PostgreSQL so Render can route static UI
    # immediately while database readiness finishes in the background.
    healthCheckPath: /api/healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: DEMO_MODE
        value: "false"
      # Public launch: master card off unless explicitly re-enabled in the Render dashboard.
      - key: ALLOW_MASTER_TEST_LOGIN
        value: "false"
      - key: DATABASE_URL
        sync: false
      - key: PUBLIC_APP_URL
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      # Set live Razorpay keys in the Render dashboard before charging real money:
      # RAZORPAY_KEY_ID, RAZORPAY_KEY_SECRET, RAZORPAY_WEBHOOK_SECRET
      # ProxyHub merchant (KYC / Razorpay Route linked account + company IFSC):
      # PROXYHUB_RAZORPAY_ACCOUNT_ID, PROXYHUB_BANK_IFSC, PROXYHUB_BANK_ACCOUNT_LAST4,
      # PROXYHUB_WEBHOOK_URL, PROXYHUB_WEBHOOK_SECRET, SETTLEMENT_AUTO_APPROVAL_HOURS
      - key: JWT_SECRET
        generateValue: true
      - key: SESSION_SECRET
        generateValue: true
    # Upgrade plan in the Render dashboard (Starter+) to avoid free-tier cold starts.
